name: Build APK

on:
  push:
    branches: ["main", "arena/019fcc77-mbwandroid"]
  pull_request:
    branches: ["main", "arena/019fcc77-mbwandroid"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle' # Встроенное кэширование зависимостей Gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        # Использует предустановленный SDK на машине GitHub, настраивая ANDROID_HOME автоматически

      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: debug-keystore-v1

      - name: Generate debug keystore if not exists
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" \
              -storepass android -keypass android
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleRelease --no-daemon

      - name: Find and Sign APK
        run: |
          # Ищем собранный release APK
          APK_FILE=$(find app/build/outputs/apk/release/ -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_FILE" ]; then
            # Запасной вариант, если структура папок отличается
            APK_FILE=$(find . -not -path '*/.*' -name "*.apk" -type f | head -n 1)
          fi
          
          echo "Found APK: $APK_FILE"
          
          # Подписываем с помощью apksigner из предустановленного SDK
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            "$APK_FILE"
            
          echo "APK_PATH=$APK_FILE" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ env.APK_PATH }}
