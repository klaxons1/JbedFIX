name: Build APK

on:
  push:
    branches: ["main", "arena/019fcc77-mbwandroid"]
  pull_request:
    branches: ["main", "arena/019fcc77-mbwandroid"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sets up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Install Android SDK
      - name: Set up Android SDK
        uses: android-sdk/setup-android-sdk@v1
        with:
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            cmdline-tools;latest

      # Cache Gradle
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Caches only the debug keystore to avoid recreating it every run
      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: debug-keystore-v1

      # Generates a new debug keystore if it wasn't restored from cache
      - name: Generate debug keystore if not exists
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" \
              -storepass android \
              -keypass android
          fi

      # Download and install Gradle 8.4
      - name: Install Gradle 8.4
        run: |
          GRADLE_VERSION=8.4
          GRADLE_URL="https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          
          echo "Downloading Gradle ${GRADLE_VERSION}..."
          curl -L "${GRADLE_URL}" -o /tmp/gradle.zip
          
          echo "Extracting Gradle..."
          unzip -q /tmp/gradle.zip -d /opt
          ln -sf /opt/gradle-${GRADLE_VERSION}/bin/gradle /usr/local/bin/gradle
          
          echo "Gradle installed:"
          gradle --version

      # Builds the release APK using Gradle
      - name: Build with Gradle
        run: gradle assembleRelease --no-daemon
        env:
          ANDROID_HOME: ${{ steps.setup-android-sdk.outputs.android-sdk-path }}

      # Dynamically locates the generated APK file across the whole workspace
      - name: Find APK file
        run: |
          APK_FILE=$(find . -not -path '*/.*' -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No APK file found in the project!"
            exit 1
          fi
          echo "Found APK: $APK_FILE"
          echo "APK_PATH=$APK_FILE" >> $GITHUB_ENV

      # Signs the APK using the pre-installed build-tools on the runner
      - name: Sign APK with debug keystore
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            "${{ env.APK_PATH }}"

      # Uploads the signed APK as a build artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ env.APK_PATH }}
          if-no-files-found: warn
