name: Build APK

on:
  push:
    branches: ["main", "arena/019fcc77-mbwandroid"]
  pull_request:
    branches: ["main", "arena/019fcc77-mbwandroid"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # Скачиваем только последний коммит для экономии времени

      - name: Set up JDK 17
        uses: actions/setup-java@v5 # Обновлено до v5 для поддержки Node 24
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle' # Встроенный кэш Gradle

      - name: Set up Android Environment
        run: |
          # Используем системный Android SDK, который уже есть на GitHub Runner
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/tools/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH

      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: debug-keystore-v1

      - name: Generate debug keystore if not exists
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" \
              -storepass android -keypass android
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleRelease --no-daemon

      - name: Find and Sign APK
        run: |
          # Ищем собранный release APK универсальным поиском, игнорируя скрытые папки
          APK_FILE=$(find . -not -path '*/.*' -name "*.apk" -type f | head -n 1)
          
          if [ -z "$APK_FILE" ]; then
            echo "Error: APK file not found!"
            exit 1
          fi
          
          echo "Found APK: $APK_FILE"
          
          # Накатываем подпись из дебажного ключа через системный apksigner
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            "$APK_FILE"
            
          echo "APK_PATH=$APK_FILE" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ env.APK_PATH }}
