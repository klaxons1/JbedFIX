name: Build APK

on:
  push:
    branches: ["main", "arena/019fcc77-mbwandroid"]
  pull_request:
    branches: ["main", "arena/019fcc77-mbwandroid"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: debug-keystore-v1

      - name: Generate debug keystore if not exists
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" \
              -storepass android -keypass android
          fi

      - name: Install Gradle 8.4
        run: |
          curl -L "https://services.gradle.org/distributions/gradle-8.4-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          ln -sf /opt/gradle-8.4/bin/gradle /usr/local/bin/gradle

      - name: Build with Gradle
        run: gradle assembleRelease --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Find APK file
        run: |
          APK_FILE=$(find . -not -path '*/.*' -name "*.apk" -type f | head -n 1)
          echo "APK_PATH=$APK_FILE" >> $GITHUB_ENV

      - name: Sign APK
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks debug.keystore --ks-pass pass:android --key-pass pass:android \
            "${{ env.APK_PATH }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ env.APK_PATH }}
