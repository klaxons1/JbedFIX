def nativeRoot = rootProject.file('..')
def runtimeJar = new File(nativeRoot, 'rom/runtime.jar')
def nativeBindings = new File(nativeRoot, 'runtime/native.bindings')
def runtimeProperties = new File(nativeRoot, 'rom/runtime.properties')
def generatedRom = layout.buildDirectory.dir('generated/rom')
def hostBuild = layout.buildDirectory.dir('rom-host')
def hostCompiler = hostBuild.map { it.file('jbedrom').asFile }

configurations {
    romTools
    romPreverifier
}
dependencies {
    romTools 'org.ow2.asm:asm:9.6'
    romTools 'org.ow2.asm:asm-tree:9.6'
    romPreverifier 'net.sf.proguard:proguard-base:6.2.2'
}

def compileRomTool = tasks.register('compileRomTool', JavaCompile) {
    source fileTree(new File(nativeRoot, 'rom/tools')) { include '*.java' }
    classpath = configurations.romTools
    destinationDirectory = generatedRom.map { it.dir('tools') }
    sourceCompatibility = '11'
    targetCompatibility = '11'
}
def compileRomProbe = tasks.register('compileRomProbe', JavaCompile) {
    source rootProject.file('probe')
    classpath = files()
    options.bootstrapClasspath = files(runtimeJar)
    destinationDirectory = generatedRom.map { it.dir('probe') }
    sourceCompatibility = '8'
    targetCompatibility = '8'
}
def subsetRom = tasks.register('subsetRom', JavaExec) {
    dependsOn compileRomTool, compileRomProbe
    classpath = configurations.romTools + files(compileRomTool.flatMap { it.destinationDirectory })
    mainClass = 'BootSubset'
    inputs.files(runtimeJar, nativeBindings, compileRomProbe.map { it.outputs.files })
    outputs.file(generatedRom.map { it.file('input.jar') })
    doFirst {
        args runtimeJar, nativeBindings, generatedRom.get().file('input.jar').asFile
        args '--startup'
        args fileTree(compileRomProbe.get().destinationDirectory).matching { include '**/*.class' }.files.sort()
    }
}
def compileRomToolTests = tasks.register('compileRomToolTests', JavaCompile) {
    dependsOn compileRomTool
    source fileTree(new File(nativeRoot, 'rom/tests')) { include '*.java' }
    classpath = configurations.romTools + files(compileRomTool.flatMap { it.destinationDirectory })
    destinationDirectory = generatedRom.map { it.dir('tool-tests') }
    sourceCompatibility = '11'
    targetCompatibility = '11'
}
def testRomPreverify = tasks.register('testRomPreverify', JavaExec) {
    dependsOn compileRomToolTests
    classpath = configurations.romTools + files(compileRomTool.flatMap { it.destinationDirectory },
        compileRomToolTests.flatMap { it.destinationDirectory })
    mainClass = 'RomPreverifyTest'
}
def prepareRomPreverification = tasks.register('prepareRomPreverification', JavaExec) {
    dependsOn subsetRom, testRomPreverify
    classpath = configurations.romTools + files(compileRomTool.flatMap { it.destinationDirectory })
    mainClass = 'RomPreverify'
    inputs.file(generatedRom.map { it.file('input.jar') })
    outputs.file(generatedRom.map { it.file('preverify-input.jar') })
    doFirst {
        args 'prepare', generatedRom.get().file('input.jar').asFile,
            generatedRom.get().file('preverify-input.jar').asFile
    }
}
def preverifyRom = tasks.register('preverifyRom', JavaExec) {
    dependsOn prepareRomPreverification
    classpath = configurations.romPreverifier
    mainClass = 'proguard.ProGuard'
    inputs.file(generatedRom.map { it.file('preverify-input.jar') })
    outputs.file(generatedRom.map { it.file('preverify-output.jar') })
    args '-target', '1.5', '-microedition', '-dontoptimize', '-dontobfuscate', '-dontshrink',
        '-keepattributes', '*', '-forceprocessing'
    doFirst {
        args '-injars', generatedRom.get().file('preverify-input.jar').asFile,
            '-outjars', generatedRom.get().file('preverify-output.jar').asFile
    }
}
def restoreRomAccess = tasks.register('restoreRomAccess', JavaExec) {
    dependsOn preverifyRom
    classpath = configurations.romTools + files(compileRomTool.flatMap { it.destinationDirectory })
    mainClass = 'RomPreverify'
    inputs.file(generatedRom.map { it.file('preverify-output.jar') })
    outputs.file(generatedRom.map { it.file('preverified.jar') })
    doFirst {
        args 'restore', generatedRom.get().file('preverify-output.jar').asFile,
            generatedRom.get().file('preverified.jar').asFile
    }
}
def verifyRomRoundtrip = tasks.register('verifyRomRoundtrip', JavaExec) {
    dependsOn restoreRomAccess
    classpath = configurations.romTools + files(compileRomTool.flatMap { it.destinationDirectory },
        compileRomToolTests.flatMap { it.destinationDirectory })
    mainClass = 'RomPreverifyTest'
    inputs.files(generatedRom.map { it.file('input.jar') },
        generatedRom.map { it.file('preverified.jar') })
    doFirst {
        args generatedRom.get().file('input.jar').asFile,
            generatedRom.get().file('preverified.jar').asFile
    }
}
def configureRomCompiler = tasks.register('configureRomCompiler', Exec) {
    inputs.file(new File(nativeRoot, 'compiler/CMakeLists.txt'))
    outputs.file(hostBuild.map { it.file('CMakeCache.txt') })
    commandLine 'cmake', '-S', new File(nativeRoot, 'compiler'), '-B', hostBuild.get().asFile,
        '-DJBED_BUILD_HOST_COMPILER=ON', '-DCMAKE_BUILD_TYPE=Release'
}
def buildRomCompiler = tasks.register('buildRomCompiler', Exec) {
    dependsOn configureRomCompiler
    inputs.files(fileTree(new File(nativeRoot, 'compiler')) {
        include '**/*.c', '**/*.h', '**/CMakeLists.txt'
        exclude 'tests/**'
    })
    outputs.file(hostCompiler)
    commandLine 'cmake', '--build', hostBuild.get().asFile, '--target', 'jbedrom', '--parallel'
}
def checkRomBindings = tasks.register('checkRomBindings', Exec) {
    dependsOn verifyRomRoundtrip, buildRomCompiler
    inputs.files(generatedRom.map { it.file('preverified.jar') }, nativeBindings, hostCompiler)
    commandLine hostCompiler.get(), '--check-bindings', '--bindings', nativeBindings,
        generatedRom.get().file('preverified.jar').asFile
}
tasks.register('generateBootImage', Exec) {
    dependsOn checkRomBindings
    inputs.files(generatedRom.map { it.file('preverified.jar') }, nativeBindings,
        runtimeProperties, hostCompiler)
    outputs.file(generatedRom.map { it.file('boot.c') })
    commandLine hostCompiler.get(), '--bindings', nativeBindings, '--properties', runtimeProperties,
        '--main', 'TransformProbe', generatedRom.get().file('boot.c').asFile,
        generatedRom.get().file('preverified.jar').asFile
}

if (!providers.gradleProperty('jbedBootImage').isPresent()) {
    tasks.configureEach {
        if (name.startsWith('configureCMake') || name.startsWith('buildCMake'))
            dependsOn tasks.named('generateBootImage')
    }
}
