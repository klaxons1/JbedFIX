plugins {
    id 'com.android.application' version '8.5.2'
}

def drmShimOutput = file('lib/armeabi/libdrm1.so')
def utilsShimOutput = file('lib/armeabi/libutils.so')
def skiaShimOutput = file('lib/armeabi/libskia.so')
def cutilsShimOutput = file('lib/armeabi/libcutils.so')
def uiShimOutput = file('lib/armeabi/libui.so')
def surfaceShimOutput = file('lib/armeabi/libsurfaceflinger_client.so')
def pngShimOutput = file('lib/armeabi/libpng.so')
def jbedCompatOutput = file('lib/armeabi/libjbedcompat.so')
// NDK r25 still supports API-19 ARM32 targets used for Android 4.4.2 tests.
def ndkVersionForDrmShim = '25.2.9519653'

tasks.register('buildDrmCompatibilityShim') {
    group = 'build'
    description = 'Builds the ARM32 native compatibility shims needed by the legacy Jbed VM.'
    inputs.files(fileTree('native_compat') {
        include '*.c'
        include '*.S'
        include '*.sh'
    })
    outputs.files(drmShimOutput, utilsShimOutput, skiaShimOutput, cutilsShimOutput, uiShimOutput, surfaceShimOutput, pngShimOutput, jbedCompatOutput)

    doLast {
        def sdkRoot = System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT')
        if (sdkRoot == null) {
            throw new GradleException('ANDROID_HOME or ANDROID_SDK_ROOT is required to build libdrm1.so')
        }
        def sdkManager = file("${sdkRoot}/cmdline-tools/latest/bin/sdkmanager")
        if (!sdkManager.canExecute()) {
            throw new GradleException("Android sdkmanager not found at ${sdkManager}; install Android command-line tools first")
        }

        exec {
            commandLine 'bash', '-c', "yes | '${sdkManager.absolutePath}' --install 'ndk;${ndkVersionForDrmShim}'"
        }
        exec {
            environment 'ANDROID_NDK_HOME', "${sdkRoot}/ndk/${ndkVersionForDrmShim}"
            commandLine 'bash', 'native_compat/build-drm1-shim.sh'
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn(tasks.named('buildDrmCompatibilityShim'))
}

// Native libraries are merged before APK packaging. Explicitly wire the shim
// task here as well: relying on preBuild alone is not sufficient on every AGP
// task graph, and would allow mergeReleaseNativeLibs to scan lib/ too early.
tasks.matching { it.name == 'mergeReleaseNativeLibs' || it.name == 'mergeDebugNativeLibs' }.configureEach {
    dependsOn(tasks.named('buildDrmCompatibilityShim'))
}

android {
    namespace 'com.esmertec.android.jbed'
    compileSdk 34
    buildToolsVersion '34.0.0'

    defaultConfig {
        // Android 4.4.2 is API 19. Keep this low enough to install on KitKat
        // test devices while retaining targetSdk 22 for Android 11 text-reloc
        // compatibility policy.
        minSdk 19
        // libjbedvm.so has text relocations from its Android 2.x build. Keep
        // the legacy target level so Android's linker applies its legacy-app
        // compatibility policy instead of enforcing the API-23+ rejection.
        targetSdk 22
        versionCode 1
        versionName '1.0'
    }

    // The project keeps the original (decompiled) APK layout:
    // sources in java/, resources in res/, assets in assets/, prebuilt native libs in lib/
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['java']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
            jniLibs.srcDirs = ['lib']
        }
    }

    lint {
        abortOnError false
    }
}
