plugins {
    id 'com.android.application' version '8.5.2'
}

def drmShimOutput = file('lib/armeabi/libdrm1.so')
def utilsShimOutput = file('lib/armeabi/libutils.so')
def ndkVersionForDrmShim = '26.3.11579264'

tasks.register('buildDrmCompatibilityShim') {
    group = 'build'
    description = 'Builds the ARM32 libdrm1 compatibility shim needed by the legacy Jbed VM.'
    outputs.files(drmShimOutput, utilsShimOutput)

    doLast {
        if (drmShimOutput.exists() && utilsShimOutput.exists()) {
            logger.lifecycle("Using existing native compatibility shims")
            return
        }

        def sdkRoot = System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT')
        if (sdkRoot == null) {
            throw new GradleException('ANDROID_HOME or ANDROID_SDK_ROOT is required to build libdrm1.so')
        }
        def sdkManager = file("${sdkRoot}/cmdline-tools/latest/bin/sdkmanager")
        if (!sdkManager.canExecute()) {
            throw new GradleException("Android sdkmanager not found at ${sdkManager}; install Android command-line tools first")
        }

        exec {
            commandLine 'bash', '-c', "yes | '${sdkManager.absolutePath}' --install 'ndk;${ndkVersionForDrmShim}'"
        }
        exec {
            environment 'ANDROID_NDK_HOME', "${sdkRoot}/ndk/${ndkVersionForDrmShim}"
            commandLine 'bash', 'native_compat/build-drm1-shim.sh'
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn(tasks.named('buildDrmCompatibilityShim'))
}

android {
    namespace 'com.esmertec.android.jbed'
    compileSdk 34
    buildToolsVersion '34.0.0'

    defaultConfig {
        minSdk 21
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }

    // The project keeps the original (decompiled) APK layout:
    // sources in java/, resources in res/, assets in assets/, prebuilt native libs in lib/
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['java']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
            jniLibs.srcDirs = ['lib']
        }
    }

    lint {
        abortOnError false
    }
}
